[project]
name = "stratix-backend"
version = "0.1.0"
description = "Backend API for Stratix strategic intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai>=0.9.2",
    "fastapi[standard]>=0.139.2",
    "langgraph>=1.2.9",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
